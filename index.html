<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="theme-color" content="#be56ff" />
    <meta name="description" content="LingYunFrp 使用文档：创建隧道、配置 frpc、把本地服务发布到公网。" />
    <meta property="og:title" content="LingYunFrp Docs" />
    <meta property="og:description" content="简单安全高效的内网穿透" />
    <title>LingYunFrp Docs</title>
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('lyfrp-theme')
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
